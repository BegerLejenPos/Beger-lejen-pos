<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Burger Lejen POS</title>
<style>
:root{--r:#d52d32;--y:#ffc928;--b:#151515;--p:#222;--l:#393939}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#f7f7f7;font:16px system-ui,sans-serif}header{position:sticky;top:0;background:#1d1d1d;border-bottom:5px solid var(--r);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}.brand{font-weight:900;font-size:clamp(18px,5vw,25px);color:var(--y)}.brand span{color:var(--r)}.sales{border:1px solid #555;border-radius:22px;padding:7px 10px;font-size:13px;white-space:nowrap}main{max-width:850px;margin:auto;padding:16px}.notice{font-size:12px;background:#302718;border:1px solid #695323;padding:10px;border-radius:10px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#222;padding:8px;border-radius:18px;margin-bottom:18px}.tabs button{background:transparent;color:#ccc;border:0;border-radius:12px;padding:13px 4px;font-size:15px;font-weight:700}.tabs button.active,.add,.pay{background:var(--r);color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.panel,.sale{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:14px}.emoji{font-size:34px}.name{font-weight:650;line-height:1.25;margin:8px 0}.price{color:var(--y);font-weight:850;font-size:20px;margin:8px 0}button{cursor:pointer}.add,.pay{width:100%;border:0;border-radius:10px;padding:12px;font-weight:800;font-size:15px}h2{color:var(--y);font-size:22px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #444}.qty{display:flex;align-items:center;gap:10px}.qty button,.quick{background:#333;color:#fff;border:1px solid #555;border-radius:8px;padding:8px 12px}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:900;margin:18px 0;color:var(--y)}.field{background:#151515;border:1px solid #666;border-radius:10px;padding:12px;margin:8px 0}.field label{display:block;color:#aaa;font-size:13px;margin-bottom:6px}.field input{width:100%;background:#080808;color:white;border:1px solid var(--y);border-radius:8px;padding:12px;font-size:20px;text-align:right}.quickrow{display:flex;gap:7px;flex-wrap:wrap}.quick{flex:1;min-width:55px}.change{display:flex;justify-content:space-between;background:#050505;padding:13px;border-radius:10px;margin:12px 0;font-weight:800}.green{color:#62d46d}.pay:disabled{background:#555;color:#999}.sale{border-left:5px solid var(--y);margin-bottom:10px}.salehead{display:flex;justify-content:space-between;gap:8px;color:#aaa;font-size:13px}.saleitems{margin:8px 0}.saleprice{color:var(--y);text-align:right;font-weight:850;font-size:20px}.outline{background:transparent;border:1px solid var(--r);color:#ff7777;border-radius:9px;padding:10px}.empty{color:#aaa;text-align:center;padding:25px 8px}footer{color:#999;text-align:center;font-size:12px;padding:25px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<header><div class="brand">🔥 BURGER <span>LEJEN</span></div><div class="sales">Jualan: <b id="salesTotal">RM 0.00</b></div></header><main>
<p class="notice">PROTOTIP DEMO — rekod hanya disimpan pada peranti/pelayar ini. Belum disambungkan ke Firebase dan belum sesuai untuk jualan sebenar berbilang telefon.</p>
<nav class="tabs"><button class="active" data-tab="menu">🍔 Menu</button><button data-tab="cart">🛒 Pesanan (<span id="cartCount">0</span>)</button><button data-tab="history">📜 Sejarah</button></nav>
<section id="menu"></section><section id="cart" hidden></section><section id="history" hidden></section></main><footer>Burger Lejen POS · Prototaip setempat</footer>
<script>
const products=[{id:1,name:"Burger Daging Biasa",price:4.5,emoji:"🍔"},{id:2,name:"Burger Ayam Special",price:6,emoji:"🍳"},{id:3,name:"Burger Double Cheese",price:8.5,emoji:"🧀"},{id:4,name:"Burger Kahwin Lejen",price:9.5,emoji:"👑"},{id:5,name:"Oblong Kambing Padu",price:10,emoji:"🥖"},{id:6,name:"Kentang Goreng (Fries)",price:4,emoji:"🍟"},{id:7,name:"Air Balang Lejen",price:3,emoji:"🥤"}];
let cart={},history=[],cash="",tab="menu";try{cart=JSON.parse(localStorage.getItem("blpos-cart")||"{}");history=JSON.parse(localStorage.getItem("blpos-history")||"[]")}catch(e){}
const money=n=>"RM "+Number(n).toFixed(2),total=()=>Object.entries(cart).reduce((s,[id,q])=>s+products.find(p=>p.id===+id).price*q,0),count=()=>Object.values(cart).reduce((a,b)=>a+b,0),sales=()=>history.reduce((s,o)=>s+o.total,0);
function save(){try{localStorage.setItem("blpos-cart",JSON.stringify(cart));localStorage.setItem("blpos-history",JSON.stringify(history))}catch(e){}}
function render(){document.getElementById("salesTotal").textContent=money(sales());document.getElementById("cartCount").textContent=count();document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));["menu","cart","history"].forEach(t=>document.getElementById(t).hidden=t!==tab);if(tab==="menu")renderMenu();if(tab==="cart")renderCart();if(tab==="history")renderHistory();save()}
function renderMenu(){document.getElementById("menu").innerHTML='<div class="grid">'+products.map(p=>`<article class="card"><div class="emoji">${p.emoji}</div><div class="name">${p.name}</div><div class="price">${money(p.price)}</div><button class="add" data-add="${p.id}">+ Tambah</button></article>`).join("")+'</div>';document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{let id=b.dataset.add;cart[id]=(cart[id]||0)+1;render()})}
function renderCart(){let t=total(),received=Number(cash)||0,change=Math.max(0,received-t);document.getElementById("cart").innerHTML=`<div class="panel"><h2>Senarai Pesanan</h2>${count()?Object.entries(cart).map(([id,q])=>{let p=products.find(x=>x.id===+id);return `<div class="item"><div><div>${p.name}</div><div style="color:var(--y);font-size:14px">${money(p.price)} × ${q} = ${money(p.price*q)}</div></div><div class="qty"><button data-minus="${id}">−</button><span>${q}</span><button data-plus="${id}">+</button></div></div>`}).join(""):'<div class="empty">Troli masih kosong.</div>'}<div class="total"><span>JUMLAH:</span><span>${money(t)}</span></div><div class="field"><label for="cash">Tunai Diterima (RM)</label><input id="cash" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" value="${cash}"><div class="quickrow" style="margin-top:10px"><button class="quick" data-cash="5">RM 5</button><button class="quick" data-cash="10">RM 10</button><button class="quick" data-cash="20">RM 20</button><button class="quick" data-cash="50">RM 50</button><button class="quick" data-cash="exact">Cukup</button></div><div class="change"><span>BAKI:</span><span class="green">${money(change)}</span></div><button class="pay" id="pay" ${!count()||received<t?"disabled":""}>BAYAR SEKARANG</button></div></div>`;
document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>{let id=b.dataset.minus;cart[id]--;if(cart[id]<=0)delete cart[id];render()});document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{cart[b.dataset.plus]++;render()});document.getElementById("cash").onchange=e=>{cash=e.target.value;renderCart()};document.getElementById("cash").oninput=e=>{cash=e.target.value;let c=document.querySelector(".change span.green");if(c)c.textContent=money(Math.max(0,(Number(cash)||0)-total()));document.getElementById("pay").disabled=!count()||(Number(cash)||0)<total()};document.querySelectorAll("[data-cash]").forEach(b=>b.onclick=()=>{cash=b.dataset.cash==="exact"?String(total()):b.dataset.cash;renderCart()});document.getElementById("pay").onclick=()=>{if(!count()||Number(cash)<total())return;let d=new Date(),o={receipt:"BL-"+String(Date.now()).slice(-6),time:d.toLocaleString("ms-MY"),items:Object.entries(cart).map(([id,q])=>({name:products.find(p=>p.id===+id).name,q})),total:total(),cash:Number(cash),change:Number(cash)-total()};history.unshift(o);cart={};cash="";save();alert("BAYARAN BERJAYA!\nResit: "+o.receipt+"\nJumlah: "+money(o.total)+"\nTunai: "+money(o.cash)+"\nBaki: "+money(o.change));tab="history";render()}}
function renderHistory(){document.getElementById("history").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2>Rekod Jualan</h2><button class="outline" id="clear">Padam Rekod</button></div>${history.length?history.map(o=>`<article class="sale"><div class="salehead"><span>No. Resit: ${o.receipt}</span><span>${o.time}</span></div><div class="saleitems">${o.items.map(i=>`${i.name} (x${i.q})`).join("<br>")}</div><div class="saleprice">${money(o.total)}</div></article>`).join(""):'<div class="empty">Belum ada rekod jualan.</div>'}`;document.getElementById("clear").onclick=()=>{if(confirm("Padam semua rekod jualan pada peranti ini?")){history=[];save();render()}}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
